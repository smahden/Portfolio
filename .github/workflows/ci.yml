name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  taskflow:
    name: TaskFlow — Node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/taskflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  shoplite:
    name: ShopLite — Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/shoplite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  recolab:
    name: RecoLab — Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/recolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Exported demo data is up to date
        run: |
          python -m recolab.export
          git diff --exit-code web/data.json

  sentinel:
    name: Sentinel — Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      # samples/ is deliberately insecure, so the tool audits its own source only.
      - run: python -m sentinel.cli secrets sentinel

  uikit:
    name: UIKit — keyboard and ARIA tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/uikit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
